name: Auto Draft PR

on:
  push:
    branches-ignore:
      - main

jobs:
  create-draft-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Draft PR with AI Description
        uses: actions/github-script@v7
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          script: |
            const { execSync } = require('child_process');

            const branch = context.ref.replace('refs/heads/', '');
            const title = branch
              .replace(/[-_]/g, ' ')
              .replace(/\b\w/g, c => c.toUpperCase());

            // Check if PR already exists
            const { data: existingPRs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open'
            });

            if (existingPRs.length > 0) {
              console.log(`PR already exists for branch: ${branch}`);
              return;
            }

            // Get default branch
            const { data: repoData } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            const defaultBranch = repoData.default_branch;

            // Get the diff
            const diff = execSync(
              `git diff origin/${defaultBranch}...HEAD -- . ':(exclude)package-lock.json' ':(exclude)*.lock'`
            ).toString().slice(0, 20000); // cap to avoid token limits

            // Call Claude API
            const response = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-api-key': process.env.ANTHROPIC_API_KEY,
                'anthropic-version': '2023-06-01'
              },
              body: JSON.stringify({
                model: 'claude-haiku-4-5-20251001',
                max_tokens: 1024,
                messages: [{
                  role: 'user',
                  content: `Generate a concise GitHub PR description for the following diff.

Use this markdown structure:
## What changed
(bullet points of key changes)

## Why
(inferred reason/purpose)

## Notes
(anything reviewers should pay attention to, or "None")

## Security
(security considerations, if any)

Diff:
${diff}`
                }]
              })
            });

            const data = await response.json();
            const body = data.content[0].text;

            // Create the PR
            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              head: branch,
              base: defaultBranch,
              draft: true,
              body
            });

            console.log(`Draft PR created with AI description for branch: ${branch}`);