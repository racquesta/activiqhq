name: Run Unit Tests
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
jobs:
  run-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm run test