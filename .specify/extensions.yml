# Speckit extension hooks (see `.cursor/commands/speckit.implement.md` and related commands).
# Agents read this file and run hooks per command instructions.
# optional: true — agent asks the user (see `prompt`); runs `command` only if they confirm.
# optional: false — agent runs `command` before continuing (no prompt).

hooks:
  before_implement:
    - extension: sync-main
      enabled: true
      optional: true
      command: bash .specify/scripts/bash/sync-main.sh
      description: Fast-forward local main from origin before implementing
      prompt: Run sync-main (git fetch, checkout main, pull) before implementation?

  after_implement: []
